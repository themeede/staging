name: UFC sportsbook sharpness research

on:
  push:
    branches:
      - research/ufc-book-sharpness-20260830
    paths:
      - .github/workflows/ufc-book-sharpness.yml
      - research/**

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests beautifulsoup4 lxml
      - name: Inspect public UFCStats mirror schema
        run: |
          python - <<'PY'
          import pandas as pd
          url='https://raw.githubusercontent.com/DanMcInerney/mma-ai/main/data/raw/ufcstats/competitions.csv'
          df=pd.read_csv(url, nrows=8)
          print('COLUMNS:', list(df.columns))
          print(df.to_string(index=False))
          PY
      - name: Decode and run sportsbook analysis
        run: |
          gzip -dc research/ufc_sharpness_public.py.gz > research/ufc_sharpness_public.py
          sed -i 's#http://ufcstats.com#https://ufcstats.com#g' research/ufc_sharpness_public.py
          python research/ufc_sharpness_public.py --output-dir ufc_book_sharpness_results
      - name: Upload complete result bundle
        uses: actions/upload-artifact@v4
        with:
          name: ufc-sportsbook-sharpness-results
          path: ufc_book_sharpness_results/
          if-no-files-found: error
          retention-days: 30
